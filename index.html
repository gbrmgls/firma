<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FIRMA</title>
    <link rel="icon" href="favicon.png" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: hsl(0, 0%, 60%);
    "
  >
    <div style="background: hsl(27, 94%, 30%)">
      <div
        style="
          padding: 2rem;
          min-height: min-content;
          max-width: 80rem;
          display: flex;
          flex-direction: column;
          gap: 4rem;
          box-shadow: 0rem 3rem hsl(27, 94%, 20%);
        "
      >
        <div style="width: 100%; display: flex; flex-direction: row; gap: 4rem">
          <div
            style="
              background: hsl(352, 70%, 60%);
              padding: 1rem;
              display: flex;
              flex-direction: column;
              gap: 1rem;
              height: min-content;
              width: min-content;
              box-shadow: 1rem 1rem black;
              position: relative;
              top: -0.5rem;
              left: -0.5rem;
            "
          >
            <img src="logo.png" alt="firma" />
            <b>FIRMA: Factory and Laboratory</b>
          </div>
          <div
            style="
              width: 100%;
              background: hsl(50, 97%, 60%);
              padding: 1rem;
              box-shadow: 0.5rem 0.5rem black;
            "
          >
            <h1>Welcome to My Website</h1>
            <p>This is a basic paragraph of text.</p>
          </div>
        </div>
        <div style="width: 100%; display: flex; flex-direction: row; gap: 4rem">
          <div
            style="
              width: 100%;
              background: hsl(140, 100%, 60%);
              padding: 1rem;
              box-shadow: 0.5rem 0.5rem black;
            "
          >
            <p>abas ebas</p>
          </div>
          <div
            style="
              width: 100%;
              background: hsl(210, 100%, 60%);
              padding: 1rem;
              box-shadow: 0.5rem 0.5rem black;
            "
          >
            <p>ibas obas</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
