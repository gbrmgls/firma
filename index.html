<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FIRMA</title>
    <link rel="icon" href="favicon.png" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: monospace;
      font-size: 1rem;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: hsl(50, 24%, 80%);
    "
  >
    <div style="background: hsl(27, 45%, 40%)">
      <div
        style="
          padding: 2rem;
          height: 40rem;
          display: flex;
          flex-direction: column;
          gap: 3rem;
          box-shadow: 0rem 2rem hsl(27, 45%, 20%);
        "
      >
        <div style="width: 100%; display: flex; flex-direction: row; gap: 3rem">
          <div
            style="
              background: hsl(352, 70%, 60%);
              width: 20rem;
              padding: 1rem;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 1rem;
              height: min-content;
              box-shadow: 0.5rem 0.5rem black;
              border: 2px solid black;
            "
          >
            <img src="logo.png" alt="firma" />
            <b>COLLECTIVE</b>
          </div>
          <div
            style="
              width: 20rem;
              background: hsl(50, 97%, 60%);
              padding: 1rem;
              display: flex;
              flex-direction: column;
              justify-content: space-around;
              align-items: center;
              box-shadow: 0.5rem 0.5rem black;
              border: 2px solid black;
            "
          >
            <b>CONTACT</b>
            contato@firmafactory.com
          </div>
        </div>
        <div style="width: 100%; display: flex; flex-direction: row; gap: 3rem">
          <div
            style="
              width: 20rem;
              background: hsl(140, 100%, 60%);
              padding: 1rem;
              display: flex;
              flex-direction: column;
              align-items: center;
              box-shadow: 0.5rem 0.5rem black;
              border: 2px solid black;
            "
          >
            <b>PROJECTS</b>
          </div>
          <div
            style="
              width: 20rem;
              background: hsl(210, 100%, 60%);
              padding: 1rem;
              display: flex;
              flex-direction: column;
              align-items: center;
              box-shadow: 0.5rem 0.5rem black;
              border: 2px solid black;
            "
          >
            <b>UPDATES</b>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
