<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FIRMA</title>
    <link rel="icon" href="favicon.png" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgb(129, 89, 28);
    "
  >
    <div
      style="
        min-height: min-content;
        max-width: 80rem;
        display: flex;
        flex-direction: column;
        gap: 4rem;
      "
    >
      <div style="width: 100%; display: flex; flex-direction: row; gap: 4rem">
        <div
          style="
            background: red;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: min-content;
            width: min-content;
            box-shadow: 1rem 1rem black;
            position: relative;
            top: -0.5rem;
            left: -0.5rem;
          "
        >
          <img src="logo.png" alt="firma" />
          <b>FIRMA: Factory and Laboratory</b>
        </div>
        <div
          style="
            width: 100%;
            background: yellow;
            padding: 1rem;
            box-shadow: 0.5rem 0.5rem black;
          "
        >
          <h1>Welcome to My Website</h1>
          <p>This is a basic paragraph of text.</p>
        </div>
      </div>
      <div style="width: 100%; display: flex; flex-direction: row; gap: 4rem">
        <div
          style="
            width: 100%;
            background: green;
            padding: 1rem;
            box-shadow: 0.5rem 0.5rem black;
          "
        >
          <p>abas ebas</p>
        </div>
        <div
          style="
            width: 100%;
            background: blue;
            padding: 1rem;
            box-shadow: 0.5rem 0.5rem black;
          "
        >
          <p>ibas obas</p>
        </div>
      </div>
    </div>
  </body>
</html>
